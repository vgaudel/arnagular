<mat-toolbar
    class="header-v2"
    [style.--couleur-ombre]="preferenceService.couleurPreferee()">
    <!-- Logo + titre -->
    <span class="brand" (click)="goToWelcome()">
        <img src="beard.svg" alt="logo" width="30px" height="30px" />
        <b>{{ titleHeader() | titlecase }}</b>
    </span>

    <span class="spacer"></span>

    <!-- Navigation Desktop -->
    <nav class="links">
        @for (link of navLinks; track link.path){
            <a matButton [routerLink]="link.path" routerLinkActive="active">{{link.label}}</a>
        }    
    </nav>

    <!-- Zone d'authentification -->
    @if (auth.isLoggedIn()) {
        <span class="user">{{ auth.currentUser()?.username }}</span>
        <button matButton type="button" (click)="logout()">Déconnexion</button>
    } @else {
        <a matButton routerLink="/login">Connexion</a>
    }

    <button 
    matIconButton 
    class="burger"
    [matMenuTriggerFor]="mobileMenu"
    aria-label="Ouvrir le menu de navigation">
        <mat-icon>menu</mat-icon>
    </button>

    <mat-menu #mobileMenu="matMenu">
        @for (link of navLinks; track link.path){
            <a mat-menu-item [routerLink]="link.path" routerLinkActive="active">{{link.label}}</a>
        } 
    </mat-menu>

</mat-toolbar>
